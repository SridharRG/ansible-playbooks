---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install tmux
  ansible.builtin.apt:
    name: tmux
    state: present

- name: Create tmux configuration directory
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.tmux"
    state: directory
    mode: '0755'
  when: ansible_user_id != 'root'

- name: Display tmux installation message
  ansible.builtin.debug:
    msg:
      - "Tmux has been successfully installed!"
      - "Start tmux with: tmux"
      - "Detach from session: Ctrl+b then d"
      - "Reattach to session: tmux attach"
      - "List sessions: tmux ls"
