---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install jq
  ansible.builtin.apt:
    name: jq
    state: present

- name: Verify jq installation
  ansible.builtin.command: jq --version
  register: jq_version
  changed_when: false

- name: Display jq installation message
  ansible.builtin.debug:
    msg:
      - "jq has been successfully installed!"
      - "Version: {{ jq_version.stdout }}"
      - "Usage: echo '{\"key\":\"value\"}' | jq ."
      - "Process JSON files: jq . < file.json"
